<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101b35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gedankenraum">
  <meta name="description" content="Mindmaps direkt im Browser erstellen, bearbeiten und als PDF ausgeben.">
  <title>Gedankenraum – Mindmap</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23101b35'/%3E%3Ccircle cx='20' cy='32' r='7' fill='%23f7c65f'/%3E%3Ccircle cx='46' cy='17' r='6' fill='%2357c7b6'/%3E%3Ccircle cx='46' cy='47' r='6' fill='%23f07c6c'/%3E%3Cpath d='M27 29 40 20M27 35l13 9' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="Gedankenraum">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-name">Gedankenraum</span>
      </div>
      <input id="mapTitle" class="map-title" value="Unterrichtsplanung · Klasse 9" aria-label="Titel der Mindmap" maxlength="80">
      <div class="top-actions">
        <span id="offlineBadge" class="offline-badge" title="Alle App-Dateien sind auf diesem Gerät gespeichert"><i></i> offline bereit</span>
        <button id="undoBtn" class="icon-btn" title="Rückgängig" aria-label="Rückgängig">↶</button>
        <button id="redoBtn" class="icon-btn" title="Wiederholen" aria-label="Wiederholen">↷</button>
        <button id="moreBtn" class="icon-btn mobile-only" aria-label="Mehr Aktionen">•••</button>
        <button id="pdfBtn" class="button primary"><span>PDF</span><b aria-hidden="true">↓</b></button>
      </div>
    </header>

    <nav class="toolbar" aria-label="Mindmap-Werkzeuge">
      <button id="newBtn" class="tool"><span aria-hidden="true">◇</span>Neu</button>
      <span class="divider"></span>
      <button id="branchBtn" class="tool accent"><span aria-hidden="true">＋</span>Hauptthema</button>
      <button id="childBtn" class="tool"><span aria-hidden="true">↳</span>Unterthema</button>
      <button id="deleteBtn" class="tool danger"><span aria-hidden="true">×</span>Löschen</button>
      <span class="divider"></span>
      <button id="fitBtn" class="tool"><span aria-hidden="true">⌗</span>Einpassen</button>
      <button id="zoomOutBtn" class="tool square" aria-label="Verkleinern">−</button>
      <output id="zoomLabel" class="zoom-label">100 %</output>
      <button id="zoomInBtn" class="tool square" aria-label="Vergrößern">＋</button>
      <span class="spacer"></span>
      <button id="importBtn" class="tool secondary">Öffnen</button>
      <button id="saveBtn" class="tool secondary">Datei sichern</button>
      <input id="fileInput" type="file" accept="application/json,.json" hidden>
    </nav>

    <main class="workspace">
      <section id="canvas" class="canvas" aria-label="Mindmap-Arbeitsfläche">
        <div class="canvas-hint" id="canvasHint">Ziehen zum Verschieben · Doppeltippen zum Bearbeiten</div>
        <svg id="mapSvg" class="map-svg" xmlns="http://www.w3.org/2000/svg" aria-label="Mindmap">
          <defs>
            <filter id="nodeShadow" x="-30%" y="-40%" width="160%" height="190%">
              <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0d1930" flood-opacity=".13"/>
            </filter>
          </defs>
          <g id="viewport">
            <g id="connections"></g>
            <g id="nodes"></g>
          </g>
        </svg>
        <div class="mini-controls" aria-label="Ansicht steuern">
          <button id="miniMinus" aria-label="Verkleinern">−</button>
          <button id="miniFit" aria-label="Mindmap einpassen">⌗</button>
          <button id="miniPlus" aria-label="Vergrößern">＋</button>
        </div>
      </section>

      <aside id="inspector" class="inspector" aria-label="Thema bearbeiten">
        <div class="inspector-head">
          <div>
            <span class="eyebrow">Ausgewähltes Thema</span>
            <h2>Inhalt & Stil</h2>
          </div>
          <button id="closeInspector" class="close-btn" aria-label="Seitenleiste schließen">×</button>
        </div>
        <label for="nodeText">Text</label>
        <textarea id="nodeText" rows="3" maxlength="180"></textarea>
        <label>Farbe</label>
        <div id="colorPicker" class="color-picker" role="radiogroup" aria-label="Themenfarbe">
          <button data-color="#1f78d1" style="--swatch:#1f78d1" aria-label="Blau"></button>
          <button data-color="#18a58f" style="--swatch:#18a58f" aria-label="Türkis"></button>
          <button data-color="#e8a628" style="--swatch:#e8a628" aria-label="Gold"></button>
          <button data-color="#e86558" style="--swatch:#e86558" aria-label="Koralle"></button>
          <button data-color="#8857cf" style="--swatch:#8857cf" aria-label="Violett"></button>
          <button data-color="#56647c" style="--swatch:#56647c" aria-label="Grau"></button>
        </div>
        <div class="inspector-actions">
          <button id="panelChildBtn" class="button primary wide">＋ Unterthema</button>
          <button id="panelDeleteBtn" class="button quiet wide">Thema löschen</button>
        </div>
        <p class="storage-note"><span aria-hidden="true">✓</span> Änderungen werden nur auf diesem Gerät gespeichert und nicht übertragen.</p>
      </aside>
    </main>

    <div id="actionMenu" class="action-menu" hidden>
      <button data-action="new">Neue Mindmap</button>
      <button data-action="import">Datei öffnen</button>
      <button data-action="save">Datei sichern</button>
      <button data-action="fit">Ansicht einpassen</button>
    </div>

    <nav class="mobile-bar" aria-label="Schnellaktionen">
      <button id="mobileBranch"><span>＋</span>Hauptthema</button>
      <button id="mobileChild"><span>↳</span>Unterthema</button>
      <button id="editBtn"><span>✎</span>Bearbeiten</button>
      <button id="mobileOpen"><span>↥</span>Öffnen</button>
      <button id="mobileSave"><span>⇩</span>Datei sichern</button>
      <button id="mobilePdf"><span>⇩</span>PDF</button>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
